version: 2
updates:
  # 本体サイト（Next.js）の npm 依存関係
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"

  # contact-worker（独立した Cloudflare Worker）の npm 依存関係
  - package-ecosystem: "npm"
    directory: "/contact-worker"
    schedule:
      interval: "weekly"

  # .github/workflows で使用している GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
