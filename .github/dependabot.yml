version: 2
updates:
  # 本体サイト（Next.js）の npm 依存関係
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    ignore:
      # typescript-eslint が TypeScript 7 に未対応（peer: <6.1.0）で、上げると lint が動かない
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # v4 は PostCSS プラグインの分離など移行作業が要るため、別途対応する
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # contact-worker（独立した Cloudflare Worker）の npm 依存関係
  - package-ecosystem: "npm"
    directory: "/contact-worker"
    schedule:
      interval: "weekly"

  # .github/workflows で使用している GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
